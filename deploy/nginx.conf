# Statische Auslieferung. Die Seite selbst liegt im Image (/srv/www), die
# exportierten Daten liegen auf dem Volume (/data/export/web/daten) — sie werden
# stuendlich neu gebaut und duerfen deshalb nicht Teil des Images sein.
server {
    listen 3000;
    server_name _;

    root /srv/www;
    index index.html;

    gzip on;
    # text/html nicht auffuehren — nginx komprimiert es ohnehin und warnt sonst
    # ueber einen doppelten MIME-Typ.
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 512;

    # Kein Tracking, keine Einbindung Dritter (Regel 13). Die CSP haelt das auch
    # dann durch, wenn spaeter versehentlich etwas Externes hineingerat.
    #
    # ACHTUNG: nginx *ersetzt* geerbte add_header-Direktiven, es ergaenzt sie
    # nicht. Jeder location-Block, der selbst ein add_header setzt, verliert
    # diese drei -- sie muessen dort wiederholt werden. Bis zum 2026-08-30 war
    # genau das der Fall: /assets/ und /daten/ gingen ohne CSP und ohne nosniff
    # hinaus, weil sie eine Cache-Zeile setzten.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /daten/ {
        alias /data/export/web/daten/;
        # Die Daten wechseln stuendlich; ein langer Cache wuerde die Seite auf
        # einem alten Betriebstag festhalten, ohne dass es auffaellt.
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location /assets/ {
        # Vite haengt einen Inhalts-Hash an jeden Dateinamen — diese Dateien
        # koennen unbegrenzt gecacht werden.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /schrift/ {
        # Die Schriften wechseln nur mit einer Gestaltungsueberarbeitung, und
        # dann unter neuem Dateinamen. Eine Woche ist lang genug, um sie nicht
        # bei jedem Aufruf neu zu bestaetigen, und kurz genug, um einen Wechsel
        # nicht auszusitzen.
        add_header Cache-Control "public, max-age=604800" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /gesundheit {
        # Fuer den Coolify-Healthcheck: der Webserver antwortet, sobald er steht.
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # HTML nie ungefragt aus dem Cache. Die Seiten verweisen auf Dateinamen
        # mit Inhalts-Hash, die nach dem naechsten Deploy nicht mehr existieren;
        # eine zwischengespeicherte HTML fordert dann ein Skript an, das es nicht
        # mehr gibt. Hier stand bis zum 2026-08-30 gar kein Cache-Control, und
        # Firefox speichert dann heuristisch — gemeldet als "Laden des Moduls
        # wurde auf Grund eines nicht freigegebenen MIME-Typs (text/html)
        # blockiert", weil die 404-Seite zurueckkam.
        #
        # "no-cache" heisst nicht "nicht speichern", sondern "vor jeder Benutzung
        # rueckfragen". Mit ETag kostet das einen 304 und keine Uebertragung.
        #
        # Dieser Block faengt auch "/" und die endungslosen Adressen — ein
        # location ~* \.html$ haette genau die nicht erwischt.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
