version: 2

models:
  - name: fct_halt_events
    description: >
      Faktentabelle und OCP-Naht: ein Halt einer Fahrt an einem Betriebstag, mit
      Soll, Ist und Zustand. Eine zweite Quelle bezieht genau hier Stellung.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [betriebstag, trip_id, stop_sequence]
    columns:
      - name: zustand
        description: "Aus dem Makro halt_zustand(). Die Zustaende schliessen sich gegenseitig aus."
        data_tests:
          - not_null
          - accepted_values:
              values: ['gemessen', 'nur_abfahrt', 'ausgelassen', 'fahrt_ausgefallen', 'ohne_meldung', 'nicht_erhoben']
      - name: richtung
        data_tests:
          - accepted_values: {values: [0, 1], quote: false}
      - name: betriebstag
        data_tests: [not_null]
      - name: route_id
        data_tests:
          - relationships: {to: ref('stg_static_linie'), field: route_id}
      - name: delay_an_sek
        data_tests:
          - dbt_utils.accepted_range:
              min_value: -600
              max_value: 7200
              config: {severity: warn}
      - name: delay_ab_sek
        data_tests:
          - dbt_utils.accepted_range:
              min_value: -600
              max_value: 7200
              config: {severity: warn}

  - name: int_fremdkennung
    description: >
      ADR-021: beobachtete Fahrten und Halte, deren trip_id in der fuer den
      Betriebstag gewaehlten Sollfahrplan-Version fehlt. Sie fallen in
      int_soll_ist aus dem Join und tauchen danach nirgends mehr auf — dieses
      Modell ist die einzige Stelle, an der sie gezaehlt werden.
    columns:
      - name: betriebstag
        data_tests: [unique, not_null]
      - name: beobachtete_fahrten
        data_tests: [not_null]
      - name: fahrten_ohne_sollrahmen
        description: "Teilmenge von beobachtete_fahrten — nie groesser."
        data_tests: [not_null]
      - name: halte_ohne_sollrahmen
        data_tests: [not_null]
      - name: static_version
        data_tests: [not_null]

  - name: int_richtung
    description: >
      Richtungsname je (route_id, richtung), abgeleitet aus dem haeufigsten Endhalt
      (ADR-006). Tragen beide Richtungen denselben Endhalt, benennt der Name
      stattdessen den Umlaufsinn ueber den Halt nach einem Viertel des Laufwegs
      ("über X") -- gemessen am 2026-08-30 betraf das RNV 5 (Tram) und
      Moonliner 3, vier von 209 Richtungen.

      Der Uniqueness-Test unten erfuellt die Pflichtliste
      "assert_richtung_eindeutig" (Referenz/TramPuls_Datenmodell.md). Er reicht
      aber nicht: ein je Richtung eindeutiger Name kann in beiden Richtungen
      derselbe sein, und dann ist der Richtungsumschalter im Frontend wirkungslos,
      ohne dass eine Zahl auffaellt. Das haelt assert_richtung_unterscheidbar
      fest.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [route_id, richtung]
    columns:
      - name: namensregel
        description: "'endhalt' (Regelfall) oder 'zwischenhalt' (beide Richtungen enden gleich)."
        data_tests:
          - not_null
          - accepted_values: {values: ['endhalt', 'zwischenhalt']}
      - name: kurzlauf_anteil
        description: >
          Anteil der Fahrten dieser Richtung, die *nicht* am haeufigsten Endhalt
          enden -- Kurzlaeufe. ADR-006 verlangt, sie auszuweisen statt sie
          stillschweigend einzurechnen. Gemessen 2026-08-30: RNV 21 Richtung 0
          liegt bei 0,68.
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
      - name: ringfahrten_anteil
        description: >
          Anteil der Fahrten, die an ihrer Startstation wieder enden. Als Zahl und
          nicht als Schwelle: RNV 5 faehrt 18-22 % ihrer Fahrten im vollen Ring,
          der Rest sind Kurzlaeufe mit zwei Enden -- eine Ja/Nein-Einteilung
          "Ringlinie" waere hier eine Behauptung.
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}

  - name: int_static_version
    description: >
      Welche Sollfahrplan-Version galt an welchem Betriebstag (Regel 9)? Seit
      ADR-019 gemessen statt geraten: gewaehlt wird die Version, gegen die sich
      die an diesem Tag beobachteten Fahrten am besten aufloesen, mit Rueckfall
      auf die juengste vorliegende.
    columns:
      - name: betriebstag
        data_tests: [unique, not_null]
      - name: aufloesbar_anteil
        description: >
          Anteil der beobachteten Fahrten, die sich gegen die gewaehlte Version
          aufloesen. Null, wenn der Tag zu wenige Beobachtungen hatte -- dann
          steht die juengste Version da, geraten statt gemessen.
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
      - name: version_gemessen
        description: "Falsch = Rueckfall auf die juengste Version, nicht an Beobachtungen geprueft."
        data_tests: [not_null]

  - name: int_erhebungsluecke
    description: >
      Je (Betriebstag, Betriebsstunde): lag eine verwertbare Beobachtung vor?
      Quelle sind Beobachtungszeitpunkte aus int_betriebstag (routenunabhaengig),
      nicht der Heartbeat (kein Verlauf vorhanden, TPULS-036).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [betriebstag, stunde]
    columns:
      - name: betriebstag
        data_tests: [not_null]
      - name: stunde
        data_tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 30}
      - name: erhoben
        data_tests: [not_null]
