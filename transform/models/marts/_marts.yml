version: 2

models:
  - name: mart_linie
    description: >
      T1 — Linienprofil je Betriebstag, Linie und Richtung. Puenktlichkeit fuer
      fuenf Schwellen nebeneinander; Ausfaelle stehen daneben, nie darin (Regel 8).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [betriebstag, route_id, richtung]
    columns:
      - name: betriebstag
        data_tests: [not_null]
      - name: route_id
        description: "Schluessel der Linie. Nie route_short_name — sieben Nummern sind doppelt vergeben (Regel 12)."
        data_tests:
          - not_null
          - relationships: {to: ref('stg_static_linie'), field: route_id}
      - name: verkehrsart
        data_tests:
          - accepted_values: {values: ['tram', 'bus', 'sonstige']}
      - name: bewertbare_halte
        description: "Nenner der Puenktlichkeit. Enthaelt keine Ausfaelle und keine ausgelassenen Halte."
        data_tests: [not_null]
      - name: soll_halte
        description: "Zweiter Nenner: alle Soll-Halte, inklusive Ausfaellen."
        data_tests: [not_null]
      - name: halte_nicht_erhoben
        description: "Halte in einer Erhebungsluecke (TPULS-036) — noch nicht im Frontend angezeigt."
        data_tests: [not_null]
      - name: bedarfsverkehr
        description: >
          Wahr fuer Linien, die nur auf Anmeldung fahren (Ruftaxi, ADR-011). Sie
          werden gerechnet und angezeigt, zaehlen aber nicht in mart_netz: eine
          nicht angemeldete Fahrt, die nicht faehrt, ist kein Ausfall.
        data_tests: [not_null]

  - name: mart_linie_stunde
    description: "T2 — Tagesgang. Betriebsstunde, nicht Kalenderstunde: 24/25/26 sind Nachtlaeufe (Regel 6)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [betriebstag, route_id, richtung, betriebsstunde]
    columns:
      - name: betriebsstunde
        data_tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 30}
      - name: route_id
        data_tests:
          - relationships: {to: ref('stg_static_linie'), field: route_id}

  - name: mart_linie_halt
    description: "T3 — Haltestellenprofil. zuwachs_schnitt_sek zeigt, wo Verspaetung neu entsteht."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [betriebstag, route_id, richtung, station_id]
    columns:
      - name: station_id
        description: "parent_station, nicht der einzelne Mast — der Mast ist als Anzeige unbrauchbar."
        data_tests: [not_null]
      - name: route_id
        data_tests:
          - relationships: {to: ref('stg_static_linie'), field: route_id}

  - name: mart_ausfall
    description: "T4 — Ausfaelle je Betriebstag, Linie, Richtung. Eigener Mart, weil Ausfall keine Verspaetung ist."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [betriebstag, route_id, richtung]
    columns:
      - name: fahrten_ausgefallen
        data_tests: [not_null]
      - name: route_id
        data_tests:
          - relationships: {to: ref('stg_static_linie'), field: route_id}

  - name: mart_netz
    description: "T5 — RNV gesamt je Betriebstag und Verkehrsart. Traegt die Zahl der Startseite."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [betriebstag, verkehrsart]
    columns:
      - name: verkehrsart
        data_tests:
          - not_null
          - accepted_values: {values: ['tram', 'bus', 'sonstige']}

  - name: mart_datenqualitaet
    description: "T8 — Deckung und Luecken je Betriebstag. Erscheint auf /methodik als Abfrageergebnis."
    columns:
      - name: betriebstag
        data_tests: [unique, not_null]
      - name: deckung
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
      - name: belegte_stunden
        description: "Aus int_erhebungsluecke (TPULS-036): tatsaechlich beobachtete Betriebsstunden, nicht nur geplante."
        data_tests: [not_null]
      - name: erhebungsluecken_stunden
        data_tests: [not_null]
      - name: halte_nicht_erhoben
        data_tests: [not_null]
      - name: erhebung_vollstaendig
        data_tests: [not_null]
      - name: beobachtete_fahrten
        description: >
          Fahrten, zu denen an diesem Betriebstag ueberhaupt eine Meldung kam —
          unabhaengig davon, ob sie im Soll-Rahmen auftauchen. Nenner zu
          fahrten_ohne_sollrahmen.
        data_tests: [not_null]
      - name: fahrten_ohne_sollrahmen
        description: >
          ADR-021: beobachtete Fahrten, deren trip_id in der fuer diesen
          Betriebstag gewaehlten Sollfahrplan-Version fehlt. Sie fallen vor
          fct_halt_events weg und stehen in keiner anderen Spalte dieses Marts.
          Erwartet wird 0; auffaellig sind Umschalttage zwischen zwei
          Fahrplanperioden.
        data_tests: [not_null]
      - name: halte_ohne_sollrahmen
        description: "Dieselbe Menge auf Halt-Ebene."
        data_tests: [not_null]

  - name: mart_kalender
    description: >
      Tagesdimension: die schulische Lage eines Betriebstags (ADR-024). Traegt
      keine Kennzahl — das Frontend summiert damit die vorhandenen Zaehler der
      uebrigen Marts ueber eine Tagesmenge, statt eine neue Quote zu bilden.

      Einzige `table` in dieser Schicht, mit Grund: eine Korrektur an der
      Ferienliste soll rueckwirkend wirken, ohne Vollaufbau (Regel 10 bleibt fuer
      die Faktenmarts unberuehrt).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [betriebstag]
    columns:
      - name: betriebstag
        description: "Betriebstag, nicht Kalendertag (Regel 6)."
        data_tests: [unique, not_null]
      - name: ferien_bw
        description: >
          Schulferien in Baden-Wuerttemberg — das Leitland mit 84,2 % der
          Soll-Halte (gemessen 2026-09-07). Ueber diese Spalte laeuft die
          veroeffentlichte Unterscheidung.

          **NULL heisst „nicht eingeordnet", nicht „Schulzeit".** Jenseits der
          gepflegten Liste bleibt der Tag unbestimmt und faellt aus beiden
          Eimern, statt still den Schulzeit-Nenner zu fuellen. Deshalb hier kein
          not_null.
      - name: ferien_rp
        description: >
          Rheinland-Pfalz, 15,4 % der Soll-Halte. Traegt keine veroeffentlichte
          Quote, sondern den wichtigsten Vorbehalt: waehrend der BW-Sommerferien
          2026 waren die Schulen dort ab dem 10.08. wieder in Betrieb.
      - name: ferien_he
        description: "Hessen, 0,4 % der Soll-Halte (10 Stationen in Viernheim)."
      - name: ferien_name
        description: "Name der BW-Ferien, sonst NULL. Beschriftung, kein Schluessel."
      - name: ferienlage
        description: "'keine' | 'teilweise' | 'alle' — wie viele der drei Laender an diesem Tag Ferien hatten. NULL, sobald eines unbekannt ist."
        data_tests:
          - accepted_values: {values: ['keine', 'teilweise', 'alle']}
