version: 2

models:
  - name: fct_halt_events
    description: >
      Faktentabelle und OCP-Naht: ein Halt einer Fahrt an einem Betriebstag, mit
      Soll, Ist und Zustand. Eine zweite Quelle bezieht genau hier Stellung.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [betriebstag, trip_id, stop_sequence]
    columns:
      - name: zustand
        description: "Aus dem Makro halt_zustand(). Die Zustaende schliessen sich gegenseitig aus."
        data_tests:
          - not_null
          - accepted_values:
              values: ['gemessen', 'nur_abfahrt', 'ausgelassen', 'fahrt_ausgefallen', 'ohne_meldung']
      - name: richtung
        data_tests:
          - accepted_values: {values: [0, 1], quote: false}
      - name: betriebstag
        data_tests: [not_null]

  - name: int_richtung
    description: "Richtungsname je (route_id, richtung), abgeleitet aus dem haeufigsten Endhalt (ADR-006)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [route_id, richtung]

  - name: int_static_version
    description: "Welche Sollfahrplan-Version galt an welchem Betriebstag (Regel 9)."
    columns:
      - name: betriebstag
        data_tests: [unique, not_null]
