# Gemeinsame Sicherheits-Header fuer alle Antworten von trampuls-web.
#
# Ausgelagert in ein Snippet, weil nginx geerbte add_header-Direktiven komplett
# verwirft, sobald ein location-Block ein eigenes add_header (z. B. Cache-Control)
# setzt. Jede Aenderung steht hier genau einmal.
#
# form-action und object-src fallen in CSP NICHT auf default-src zurueck und
# muessen deshalb ausdruecklich auf 'none' stehen.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
