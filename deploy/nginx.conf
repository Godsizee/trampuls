# Statische Auslieferung. Die Seite selbst liegt im Image (/srv/www), die
# exportierten Daten liegen auf dem Volume (/data/export/web/daten) — sie werden
# stuendlich neu gebaut und duerfen deshalb nicht Teil des Images sein.
server {
    listen 3000;
    server_name _;

    root /srv/www;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css text/html image/svg+xml;
    gzip_min_length 512;

    # Kein Tracking, keine Einbindung Dritter (Regel 13). Die CSP haelt das auch
    # dann durch, wenn spaeter versehentlich etwas Externes hineingerat.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /daten/ {
        alias /data/export/web/daten/;
        # Die Daten wechseln stuendlich; ein langer Cache wuerde die Seite auf
        # einem alten Betriebstag festhalten, ohne dass es auffaellt.
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location /assets/ {
        # Vite haengt einen Inhalts-Hash an jeden Dateinamen — diese Dateien
        # koennen unbegrenzt gecacht werden.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /gesundheit {
        # Fuer den Coolify-Healthcheck: der Webserver antwortet, sobald er steht.
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
