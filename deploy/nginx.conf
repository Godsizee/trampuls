# Statische Auslieferung. Die Seite selbst liegt im Image (/srv/www), die
# exportierten Daten liegen auf dem Volume (/data/export/web/daten) — sie werden
# stuendlich neu gebaut und duerfen deshalb nicht Teil des Images sein.
server {
    listen 3000;
    server_name _;

    # Keine Versionsnummer im Server-Header oder auf Fehlerseiten preisgeben.
    server_tokens off;

    # Keine Zugriffsprotokolle mit Besucher-IPs schreiben (TramPuls_Recht_und_Lizenz:
    # "Serverlogs ohne IP-Speicherung"). Fehlerprotokoll bleibt fuer Betriebsstörungen.
    access_log off;

    root /srv/www;
    index index.html;

    gzip on;
    # text/html nicht auffuehren — nginx komprimiert es ohnehin und warnt sonst
    # ueber einen doppelten MIME-Typ.
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 512;

    # Kein Tracking, keine Einbindung Dritter (Regel 13).
    # WICHTIG: jeder location-Block mit eigenem add_header MUSS dieses Snippet
    # erneut einbinden, weil nginx geerbte add_header-Zeilen sonst verwirft.
    include /etc/nginx/snippets/trampuls-sicherheit.conf;

    location /daten/ {
        alias /data/export/web/daten/;
        # Die Daten wechseln stuendlich; ein langer Cache wuerde die Seite auf
        # einem alten Betriebstag festhalten, ohne dass es auffaellt.
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/snippets/trampuls-sicherheit.conf;
        try_files $uri =404;
    }

    location /assets/ {
        # Vite haengt einen Inhalts-Hash an jeden Dateinamen — diese Dateien
        # koennen unbegrenzt gecacht werden.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/trampuls-sicherheit.conf;
    }

    location /schrift/ {
        # Die Schriften wechseln nur mit einer Gestaltungsueberarbeitung, und
        # dann unter neuem Dateinamen.
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/trampuls-sicherheit.conf;
    }

    location = /gesundheit {
        # Fuer den Coolify-Healthcheck: der Webserver antwortet, sobald er steht.
        default_type text/plain;
        include /etc/nginx/snippets/trampuls-sicherheit.conf;
        return 200 "ok\n";
    }

    location / {
        # HTML nie ungefragt aus dem Cache (verhindert Hash-Mismatch nach Deploy).
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/trampuls-sicherheit.conf;
        try_files $uri $uri.html $uri/ =404;
    }
}
