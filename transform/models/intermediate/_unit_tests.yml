version: 2

unit_tests:
  # Der Vorfall vom 2026-08-30 als Fixture (ADR-019): eine neue Sollfahrplan-
  # Version liegt vor, aber der Echtzeitfeed meldet weiter die Kennungen der
  # Vorfassung. Auf dem Produktionsstand liegt immer nur eine Handvoll Versionen
  # nebeneinander -- die Auswahl zwischen zweien laesst sich sonst nirgends
  # nachweisen, und genau sie ist der Kern der Aenderung.
  - name: int_static_version_waehlt_was_der_feed_benutzt
    model: int_static_version
    description: >
      Die aeltere Version loest alle beobachteten Fahrten auf, die juengere
      keine. Gewaehlt werden muss die aeltere -- obwohl die juengere vorliegt und
      sich selbst als gueltig ausweist.
    given:
      - input: ref('int_betriebstag')
        format: sql
        rows: |
          select date '2026-08-30' as betriebstag, 'alt-' || i as trip_id
          from generate_series(1, 60) t(i)
      - input: ref('stg_static_fahrt')
        format: sql
        rows: |
          select date '2026-08-29' as static_version, 'alt-' || i as trip_id
          from generate_series(1, 60) t(i)
          union all
          select date '2026-08-30' as static_version, 'neu-' || i as trip_id
          from generate_series(1, 60) t(i)
    expect:
      format: sql
      rows: |
        select date '2026-08-30' as betriebstag,
               date '2026-08-29' as static_version,
               date '2026-08-29' as aelteste_version,
               1.0               as aufloesbar_anteil,
               true              as version_gemessen

  # Gegenprobe: hat der Feed nachgezogen, gewinnt die juengste Version wieder von
  # selbst. Ohne diesen Fall waere die Aenderung eine Einbahnstrasse, die nach dem
  # naechsten Fahrplanwechsel auf der alten Version haengen bliebe.
  - name: int_static_version_zieht_nach
    model: int_static_version
    given:
      - input: ref('int_betriebstag')
        format: sql
        rows: |
          select date '2026-08-30' as betriebstag, 'neu-' || i as trip_id
          from generate_series(1, 60) t(i)
      - input: ref('stg_static_fahrt')
        format: sql
        rows: |
          select date '2026-08-29' as static_version, 'alt-' || i as trip_id
          from generate_series(1, 60) t(i)
          union all
          select date '2026-08-30' as static_version, 'neu-' || i as trip_id
          from generate_series(1, 60) t(i)
    expect:
      format: sql
      rows: |
        select date '2026-08-30' as betriebstag,
               date '2026-08-30' as static_version,
               date '2026-08-29' as aelteste_version,
               1.0               as aufloesbar_anteil,
               true              as version_gemessen

  # Zu duenner Tag: die Mehrheit entscheidet nichts Belastbares, also faellt das
  # Modell auf die juengste Version zurueck und sagt das auch (version_gemessen).
  # Ohne die Schwelle koennte ein Tag mit drei Zufallstreffern die Version fuer
  # alle Kennzahlen dieses Tages bestimmen.
  - name: int_static_version_zu_wenig_beobachtet
    model: int_static_version
    given:
      - input: ref('int_betriebstag')
        format: sql
        rows: |
          select date '2026-08-30' as betriebstag, 'alt-' || i as trip_id
          from generate_series(1, 5) t(i)
      - input: ref('stg_static_fahrt')
        format: sql
        rows: |
          select date '2026-08-29' as static_version, 'alt-' || i as trip_id
          from generate_series(1, 5) t(i)
          union all
          select date '2026-08-30' as static_version, 'neu-' || i as trip_id
          from generate_series(1, 5) t(i)
    expect:
      format: sql
      rows: |
        select date '2026-08-30' as betriebstag,
               date '2026-08-30' as static_version,
               date '2026-08-29' as aelteste_version,
               cast(null as double) as aufloesbar_anteil,
               false             as version_gemessen

  # Eine Version, die es am Betriebstag noch nicht gab, darf nie gewinnen -- auch
  # dann nicht, wenn sie perfekt aufloest. Sonst aendert eine Veroeffentlichung
  # von morgen rueckwirkend den gestrigen Join, und das verbietet Regel 9.
  - name: int_static_version_ignoriert_spaetere_versionen
    model: int_static_version
    given:
      - input: ref('int_betriebstag')
        format: sql
        rows: |
          select date '2026-08-29' as betriebstag, 'neu-' || i as trip_id
          from generate_series(1, 60) t(i)
      - input: ref('stg_static_fahrt')
        format: sql
        rows: |
          select date '2026-08-28' as static_version, 'alt-' || i as trip_id
          from generate_series(1, 60) t(i)
          union all
          select date '2026-08-30' as static_version, 'neu-' || i as trip_id
          from generate_series(1, 60) t(i)
    expect:
      format: sql
      rows: |
        select date '2026-08-29' as betriebstag,
               date '2026-08-28' as static_version,
               date '2026-08-28' as aelteste_version,
               0.0               as aufloesbar_anteil,
               true              as version_gemessen

  # Der gemessene Defekt vom 2026-08-30 als Fixture: beide Richtungen enden an
  # derselben Station, der Endhalt unterscheidet also nichts. Erwartet wird der
  # Zwischenhalt nach einem Viertel des Laufwegs -- und der ist je Umlaufsinn ein
  # anderer.
  - name: int_richtung_unterscheidet_gleiche_endhalte
    model: int_richtung
    given:
      - input: ref('stg_static_fahrt')
        rows:
          - {route_id: R, richtung: 0, trip_id: t0, static_version: "2026-08-27"}
          - {route_id: R, richtung: 1, trip_id: t1, static_version: "2026-08-27"}
      - input: ref('stg_static_sollhalt')
        rows:
          - {trip_id: t0, static_version: "2026-08-27", stop_id: a, stop_sequence: 1}
          - {trip_id: t0, static_version: "2026-08-27", stop_id: b, stop_sequence: 2}
          - {trip_id: t0, static_version: "2026-08-27", stop_id: c, stop_sequence: 3}
          - {trip_id: t0, static_version: "2026-08-27", stop_id: a, stop_sequence: 4}
          - {trip_id: t1, static_version: "2026-08-27", stop_id: a, stop_sequence: 1}
          - {trip_id: t1, static_version: "2026-08-27", stop_id: d, stop_sequence: 2}
          - {trip_id: t1, static_version: "2026-08-27", stop_id: c, stop_sequence: 3}
          - {trip_id: t1, static_version: "2026-08-27", stop_id: a, stop_sequence: 4}
      - input: ref('stg_static_halt')
        rows:
          - {stop_id: a, static_version: "2026-08-27", station_id: A, station_name: Ringende, halt_name: Ringende}
          - {stop_id: b, static_version: "2026-08-27", station_id: B, station_name: Westweg, halt_name: Westweg}
          - {stop_id: c, static_version: "2026-08-27", station_id: C, station_name: Gegenueber, halt_name: Gegenueber}
          - {stop_id: d, static_version: "2026-08-27", station_id: D, station_name: Ostweg, halt_name: Ostweg}
    expect:
      rows:
        - {route_id: R, richtung: 0, richtung_name: "über Westweg", namensregel: zwischenhalt,
           fahrten_mit_diesem_endhalt: 1, fahrten_gesamt: 1, kurzlauf_anteil: 0.0, ringfahrten_anteil: 1.0}
        - {route_id: R, richtung: 1, richtung_name: "über Ostweg", namensregel: zwischenhalt,
           fahrten_mit_diesem_endhalt: 1, fahrten_gesamt: 1, kurzlauf_anteil: 0.0, ringfahrten_anteil: 1.0}

  # Gegenprobe: unterscheiden sich die Endhalte, bleibt es beim Endhalt. Eine
  # Linie soll keinen laengeren Namen bekommen, den niemand braucht.
  - name: int_richtung_laesst_klare_endhalte_in_ruhe
    model: int_richtung
    given:
      - input: ref('stg_static_fahrt')
        rows:
          - {route_id: R, richtung: 0, trip_id: t0, static_version: "2026-08-27"}
          - {route_id: R, richtung: 1, trip_id: t1, static_version: "2026-08-27"}
      - input: ref('stg_static_sollhalt')
        rows:
          - {trip_id: t0, static_version: "2026-08-27", stop_id: a, stop_sequence: 1}
          - {trip_id: t0, static_version: "2026-08-27", stop_id: b, stop_sequence: 2}
          - {trip_id: t1, static_version: "2026-08-27", stop_id: b, stop_sequence: 1}
          - {trip_id: t1, static_version: "2026-08-27", stop_id: a, stop_sequence: 2}
      - input: ref('stg_static_halt')
        rows:
          - {stop_id: a, static_version: "2026-08-27", station_id: A, station_name: Nord, halt_name: Nord}
          - {stop_id: b, static_version: "2026-08-27", station_id: B, station_name: Sued, halt_name: Sued}
    expect:
      rows:
        - {route_id: R, richtung: 0, richtung_name: Sued, namensregel: endhalt,
           fahrten_mit_diesem_endhalt: 1, fahrten_gesamt: 1, kurzlauf_anteil: 0.0, ringfahrten_anteil: 0.0}
        - {route_id: R, richtung: 1, richtung_name: Nord, namensregel: endhalt,
           fahrten_mit_diesem_endhalt: 1, fahrten_gesamt: 1, kurzlauf_anteil: 0.0, ringfahrten_anteil: 0.0}
