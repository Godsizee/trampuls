version: 2

seeds:
  - name: bedarfsverkehr
    description: >
      Die RNV-Linien, die nur auf Anmeldung fahren (Ruftaxi), gekennzeichnet als
      Seed und nicht als Namensregel (ADR-011). "Nummer ueber 1000" waere eine
      Heuristik, die beim naechsten Fahrplanwechsel bricht -- genau deshalb steht
      hier eine gepflegte Liste. Sie kostet eine Zeile Pflege je
      Fahrplanveroeffentlichung und macht dafuer sichtbar, wenn eine Linie neu
      dazukommt, statt dass sie stillschweigend in die Netzsumme rutscht.

      Stand 2026-08-30 gegen Version v=2026-08-30: zwoelf Linien.

      Zwei Abweichungen zur Liste in ADR-011, beide gemessen und beide ein Beleg
      dafuer, dass eine Nummernregel hier nicht getragen haette:

      - **RNV 85 fehlte in ADR-011.** Die Linie heisst "Ruftaxi: LU Oppau - LU
        Oppau West", traegt aber eine Nummer unter 1000 und waere jeder Regel der
        Form "ueber 1000" entgangen. Gefunden am 2026-08-30 durch
        assert_bedarfsverkehr_vollstaendig, im ersten Lauf dieses Tests.
      - **RNV 1012 existiert nicht** im aktuellen Sollfahrplan als eigene Route
        (ADR-011 nannte am 2026-08-27 den Bereich 1007-1013). Taucht sie wieder
        auf, meldet derselbe Test sie.
    columns:
      - name: route_id
        description: Schluessel (Regel 12). linie ist ausschliesslich Anzeige.
        tests: [unique, not_null]
      - name: linie
        tests: [not_null]
  - name: quelle_openrnv
    description: >
      Die Linien, deren Ist-Daten **nicht** aus dem VRN-Feed kommen, sondern aus
      openRNV (ADR-023). Aufnahmekriterium ist kein Gefuehl, sondern eine Zahl:
      **keine einzige bewertbare Beobachtung im eigenen Bestand**, bei
      gleichzeitiger Lieferung durch openRNV.

      Stand 2026-09-02, gemessen ueber 2026-08-28 bis 2026-09-02 (6 Betriebstage,
      890.659 Soll-Halte im Netz, 43,5 % davon bewertbar): vier
      Strassenbahnlinien mit zusammen 78.414 Soll-Halten und 0 Beobachtungen.
      openRNV deckt dieselben Linien am Betriebstag 2026-09-01 zu 95,4 bis
      100,0 % ab -- am oberen Rand des Bandes der Kontrolllinien (ADR-022).

      **Nicht aufgenommen, obwohl naheliegend:**

      - **RNV 9** (`de:vrn:02009:s`, in openRNV "9X"). Die Messung vom
        2026-09-02 fuehrte sie als blind -- das war ein Artefakt des
        Messwerkzeugs, das VRN-Namen auf die openRNV-Schreibweise normalisiert
        ("RNV 9" -> "9") und danach "9X" suchte. Im eigenen Bestand sind 1.782
        von 10.545 Soll-Halten bewertbar (16,9 %). Schwach, nicht blind -- und
        wo beide Quellen liefern, braeuchte es eine Bruecke je Fahrt, die zu
        10,7 % raten muesste (ADR-022).
      - **22 Buslinien** mit zusammen 51.864 Soll-Halten und ebenfalls 0
        Beobachtungen. Dass der VRN-Feed sie nicht meldet, steht fest; dass
        openRNV sie meldet, steht **nicht** fest -- ein Einzelabruf zeigte 0 bis
        4 Fahrten je Linie, was keine Aussage ist. Sie kommen dazu, sobald der
        eigene openRNV-Bestand sie belegt, nicht vorher.

      Die Zuordnung laeuft ueber (openrnv_linie, openrnv_verkehrsart) und nicht
      ueber die route_id: openRNV fuehrt mehrere route_id je Linie (1.343 Routen
      fuer gut 100 Linien, gemessen 2026-09-02). Die Verkehrsart gehoert
      zwingend dazu -- sieben RNV-Nummern sind zwischen Tram und Bus doppelt
      vergeben (Regel 12).

      Aendert sich diese Liste, wirkt das **rueckwirkend** auf alle Betriebstage.
      Ein Vollaufbau ist dann Pflicht (ADR-012); die Seed-Signatur in
      pruefung-stuendlich meldet es, wenn er ausbleibt.
    columns:
      - name: route_id
        description: >
          Der Schluessel des VRN-Sollfahrplans -- unter ihm existiert die Linie im
          Frontend schon heute, mit Verlauf und Richtungen, nur ohne Zahlen.
        tests: [unique, not_null]
      - name: linie
        description: Anzeige, nie Schluessel (Regel 12).
        tests: [not_null]
      - name: openrnv_linie
        description: route_short_name im openRNV-Sollfahrplan.
        tests: [not_null]
      - name: openrnv_verkehrsart
        tests:
          - not_null
          - accepted_values:
              values: ["tram", "bus"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [openrnv_linie, openrnv_verkehrsart]
  - name: schulferien
    description: >
      Die Schulferien der drei Laender, in denen die rnv faehrt (ADR-024).
      Grundlage der Einordnung eines Betriebstags in mart_kalender.

      **Warum eine gepflegte Liste und keine Bezugsquelle.** Die Termine aendern
      sich zweimal im Jahr und stehen Jahre im Voraus fest. Eine Abhaengigkeit zu
      einer fremden Schnittstelle waere Datenbeschaffung in dbt (SRP) und ein
      Ausfallpunkt fuer eine Zahl, die sich nie kurzfristig aendert.

      **Leitland ist Baden-Wuerttemberg.** Gemessen 2026-09-07 gegen Version
      v=2026-08-27, Landeszuordnung ueber die ersten beiden Stellen des AGS in
      der DHID (`de:08222:...` = Mannheim/BW): von 419.991 Soll-Halten liegen
      **353.506 = 84,2 % in Baden-Wuerttemberg**, 64.874 = 15,4 % in
      Rheinland-Pfalz, 1.611 = 0,4 % in Hessen.

      Rheinland-Pfalz und Hessen stehen trotzdem in der Liste, obwohl keine
      veroeffentlichte Quote ueber sie laeuft: ohne sie liesse sich der wichtigste
      Vorbehalt nicht beziffern. Waehrend der BW-Sommerferien 2026
      (30.07.-12.09.) waren die Schulen in Rheinland-Pfalz ab dem 10.08. wieder in
      Betrieb -- fuer 15,4 % des Netzes ist ein BW-Ferientag ein Schultag.

      **Was hier bewusst nicht steht:**

      - **Bewegliche Ferientage.** BW gewaehrt vier, RP sechs, Hessen drei bis
        vier je Schuljahr, und jede Schule legt sie selbst. Sie sind zentral nicht
        bekannt und laufen als Schulzeit mit.
      - **Feiertage.** Ein Feiertag in der Schulzeit faehrt verkehrlich wie ein
        Ferientag, ist aber eine eigene Frage. Die Spalte `art` nimmt ihn ohne
        Schemabruch auf, sobald gemessen ist, dass er die Quote traegt.

      Der Reformationstag 2026 steht als eigene Zeile und nicht als Verlaengerung
      der Herbstferien: das Kultusministerium fuehrt ihn getrennt, und ein Seed,
      der amtliche Zeitraeume umschreibt, ist als Beleg nichts mehr wert.

      **Aendert sich diese Liste, ist kein Vollaufbau noetig** -- anders als bei
      bedarfsverkehr und quelle_openrnv. mart_kalender ist `table` und baut
      vollstaendig neu bei jedem Lauf; deshalb nimmt die Seed-Signatur in
      pruefung-stuendlich diese Datei ausdruecklich aus (ADR-024). Wer sie je in
      einen inkrementellen Mart joint, muss dort dieselbe Ausnahme zuruecknehmen.
    config:
      column_types:
        von: date
        bis: date
    columns:
      - name: bundesland
        description: Kuerzel, nicht Name -- der Schluessel der Pivotierung in mart_kalender.
        data_tests:
          - not_null
          - accepted_values: {values: ['BW', 'RP', 'HE']}
      - name: art
        data_tests:
          - not_null
          - accepted_values:
              values: ['sommer', 'herbst', 'weihnachten', 'ostern', 'pfingsten', 'schulfrei']
      - name: name
        description: Anzeige. Steht als `ferien_name` in mart_kalender, sobald der Tag in BW-Ferien faellt.
        data_tests: [not_null]
      - name: von
        data_tests: [not_null]
      - name: bis
        data_tests: [not_null]
      - name: quelle
        description: >
          Je Zeile die Stelle, aus der der Termin stammt. Amtlich, bis auf die
          hessischen Sommerferien 2026: die gehoeren ins Schuljahr 2025/2026, das
          das Kultusministerium nicht mehr fuehrt. 0,4 % des Netzes, keine
          veroeffentlichte Quote haengt daran.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [bundesland, von]
